<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>CRU MAP - แผนที่โรงเรียนชลราษฎรอำรุง</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Tahoma', 'Arial', sans-serif;
    }

    body {
      margin: 0;
      padding: 30px;
      /* Gradient */
      background: linear-gradient(135deg, #1fa2a6 0%, #e0a323 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center; /* Center layout horizontally */
    }

    /* main title */
    .main-title {
      font-size: 60px;
      font-weight: bold;
      margin: 0 0 20px 0;
      color: #000;
      width: 100%;
      max-width: 1400px;
      text-align: left;
    }

    /* container for all box - expanded equal layout */
    .app-container {
      display: flex;
      gap: 30px; 
      justify-content: center;
      align-items: stretch;
      width: 100%;
      max-width: 1400px;
      height: 650px; /* Fixed height so both panels scale straight */
    }

    /* ------------------------------------------
       left map description
       ------------------------------------------ */
    .left-panel {
      flex: 1; /* Equal width with right panel */
      background-color: #ffffff;
      border: 4px solid #000000;
      padding: 30px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100%;
    }

    .building-title {
      font-size: 28px;
      font-weight: bold;
      color: #000;
      margin-bottom: 20px;
      word-break: break-word;
    }

    .building-img {
      width: 100%;
      height: 100%;
      max-height: 480px;
      object-fit: cover;
      border: 3px solid #000;
      display: none; /* hide the img */
      border-radius: 4px;
    }

    /* ------------------------------------------
       right map
       ------------------------------------------ */
    .right-panel {
      flex: 1; /* Equal width with left panel */
      background-color: #ffffff;
      border: 4px solid #000000;
      padding: 20px;
      display: flex;
      height: 100%;
    }

    /* line around map */
    .map-frame {
      border: 3px solid #000;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      height: 100%;
      justify-content: space-between;
    }

    .map-row {
      display: flex;
      gap: 12px;
      align-items: stretch;
      justify-content: space-between;
      flex: 1;
    }

    .map-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: space-between;
      flex: 1;
    }

    /* border around building buttons */
    .group-box {
      border: 2px solid #000;
      padding: 8px;
      display: flex;
      gap: 8px;
      align-items: stretch;
      justify-content: center;
      flex: 1;
    }

    /* normal buttons */
    .btn-building {
      background-color: #000000;
      color: #ffffff;
      border: 2px solid #ff0000;
      padding: 8px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      border-radius: 4px;
      text-align: center;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
      height: 100%;
    }

    .btn-building:hover {
      opacity: 0.8;
    }

    /* green active */
    .btn-building.active {
      background-color: #1b5e20 !important;
      border-color: #00ff00 !important;
      color: #ffffff !important;
      box-shadow: 0 0 8px #00ff00;
    }

    .box-pracha {
      border: 2px solid #000;
      padding: 8px;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-width: 75px;
    }
    
    .btn-mini {
      width: 28px;
      height: 28px;
      flex: none;
      margin: 8px auto 0 auto;
    }

    .box-pokkrong {
      border: 2px solid #000;
      padding: 8px;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      min-width: 90px;
    }

    .box-pokkrong .btn-building {
      flex: 1;
      width: 32px;
      margin: 4px 0;
    }

    .pin-icon {
      color: red;
      font-size: 18px;
    }

    .grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
      flex: 2;
    }

    .btn-football {
      flex: 0.8;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <!-- head text -->
  <h1 class="main-title">CRU map</h1>

  <!-- 2 side container -->
  <div class="app-container">

    <!-- left descrip -->
    <div class="left-panel">
      <div id="building-name" class="building-title">click on any building</div>
      <img id="building-img" class="building-img" src="" alt="รูปภาพตึก">
    </div>

    <!-- right map -->
    <div class="right-panel">
      <div class="map-frame">

        <!-- up row -->
        <div class="map-row">
          
          <!-- publication -->
          <div class="box-pracha">
            <div>publi<br>cation</div>
            <button class="btn-building btn-mini" onclick="selectBuilding('pracha', this)"></button>
          </div>

          <!-- B.5, B.2, B.1, statue -->
          <div class="map-col" style="flex: 1.5;">
            <div class="map-row">
              <button class="btn-building" onclick="selectBuilding('b5', this)">B. 5</button>
              <button class="btn-building" onclick="selectBuilding('b2', this)">B. 2</button>
            </div>
            <div class="map-row">
              <button class="btn-building" style="flex: 1.5;" onclick="selectBuilding('b1', this)">B. 1</button>
              <button class="btn-building" onclick="selectBuilding('statue', this)">statue</button>
            </div>
          </div>

          <!-- corner Nursing & Bank -->
          <div class="group-box" style="flex: 1.2;">
            <button class="btn-building" onclick="selectBuilding('nursing', this)">Nursing</button>
            <button class="btn-building" onclick="selectBuilding('bank', this)">Bank</button>
          </div>

          <!-- B. 7 -->
          <div class="group-box" style="flex: 0.6;">
            <button class="btn-building" onclick="selectBuilding('b7', this)">B. 7</button>
          </div>

        </div>

        <!-- bottom row -->
        <div class="map-row">

          <!-- student management -->
          <div class="box-pokkrong">
            <div class="pin-icon">📍</div>
            <button class="btn-building" onclick="selectBuilding('pokkrong', this)"></button>
            <div>student<br>management</div>
          </div>

          <!-- middle: B.3, Assembly field / B.4, B.8 -->
          <div class="map-col" style="flex: 2;">
            <div class="group-box">
              <button class="btn-building" style="flex: 0.7;" onclick="selectBuilding('b3', this)">B. 3</button>
              <button class="btn-building" style="flex: 1.5;" onclick="selectBuilding('assembly', this)">Assembly field</button>
            </div>
            <div class="group-box">
              <button class="btn-building" onclick="selectBuilding('b4', this)">B. 4</button>
              <button class="btn-building" onclick="selectBuilding('b8', this)">B. 8</button>
            </div>
          </div>

          <!-- right group: B.9, Gym, Dome, Farm -->
          <div class="group-box grid-2x2">
            <button class="btn-building" onclick="selectBuilding('b9', this)">B. 9</button>
            <button class="btn-building" onclick="selectBuilding('gym', this)">Gym</button>
            <button class="btn-building" onclick="selectBuilding('farm', this)">Farm</button>
            <button class="btn-building" onclick="selectBuilding('dome', this)">Dome</button>
          </div>

          <!-- field -->
          <button class="btn-building btn-football" onclick="selectBuilding('football', this)">
            Football<br>field
          </button>

        </div>

      </div>
    </div>

  </div>

  <!-- ==========================================
      (JavaScript)
      ========================================== -->
  <script>
    /* ----------------------------------------------------
       building data
       ---------------------------------------------------- */
    const buildingData = {
      'pracha': {
        name: 'publication [อาคารประชาสัมพันธ์]',
        image: 'b-pub.jpg'
      },
      'b1': {
        name: 'Building 1 [อาคาร 1]',
        image: 'b-1.jpg'
      },
      'b2': {
        name: 'Building 2 [อาคาร 2]',
        image: 'b-2.jpg'
      },
      'b3': {
        name: 'Building 3 [อาคาร 3]',
        image: 'b-3.jpg'
      },
      'b4': {
        name: 'Building 4 [อาคาร 4]',
        image: 'b-4.jpg'
      },
      'b5': {
        name: 'Building 5 [อาคาร 5]',
        image: 'b-5.jpg'
      },
      'b7': {
        name: 'Building 7 [อาคาร 7]',
        image: 'b-7.jpg'
      },
      'b8': {
        name: 'Building 8 [อาคาร 8]',
        image: 'b-8.jpg'
      },
      'b9': {
        name: 'Building 9 [อาคาร 9]',
        image: 'b-9.jpg'
      },
      'statue': {
        name: 'statue [พระพุทธรูปประจำโรงเรียน]',
        image: 'b-bud.jpg'
      },
      'nursing': {
        name: 'Nursing [ห้องพยาบาล]',
        image: 'b-nurse.jpg'
      },
      'bank': {
        name: 'Bank [ธนาคารโรงเรียน]',
        image: 'b-bank.jpg'
      },
      'pokkrong': {
        name: 'student management [อาคารกลุ่มบริหารงานปกครอง]',
        image: 'b-stu.jpg'
      },
      'assembly': {
        name: 'Assembly field [ลานเข้าแถว]',
        image: 'b-assm.jpg'
      },
      'gym': {
        name: 'Gym [โรงยิม / อาคารพลศึกษา]',
        image: 'b-gym.jpg'
      },
      'dome': {
        name: 'Dome [อาคารโดมอเนกประสงค์]',
        image: 'b-dome.jpg'
      },
      'farm': {
        name: 'Farm [แปลงเกษตร / สวนการเรียนรู้]',
        image: 'b-farm.jpg'
      },
      'football': {
        name: 'Football field [สนามฟุตบอล]',
        image: 'b-feild.jpg'
      }
    };

    // current butt
    let currentSelectedBtn = null;

    /* ----------------------------------------------------
       when click any building
       ---------------------------------------------------- */
    function selectBuilding(buildingKey, btnElement) {
      const data = buildingData[buildingKey];

      if (data) {
        // left text upd
        document.getElementById('building-name').innerText = data.name;

        // right img upd
        const imgElement = document.getElementById('building-img');
        imgElement.src = data.image;
        imgElement.alt = data.name;
        imgElement.style.display = 'block'; // สั่งให้แสดงรูปภาพ
      }

      // green colour delet
      if (currentSelectedBtn !== null) {
        currentSelectedBtn.classList.remove('active');
      }

      // add green color
      btnElement.classList.add('active');

      // store current butt
      currentSelectedBtn = btnElement;
    }
  </script>

</body>
</html>
